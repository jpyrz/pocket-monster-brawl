name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: pmb_test
          POSTGRES_USER: pmb
          POSTGRES_PASSWORD: pmb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pmb -d pmb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://pmb:pmb@127.0.0.1:5432/pmb_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: npm run check
      - run: docker compose build
      - run: docker compose up --detach --wait
      - run: curl --fail --silent http://127.0.0.1:3000/api/health
      - run: curl --fail --silent http://127.0.0.1:3000/ | grep --quiet "Pocket Monster Brawl"
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
